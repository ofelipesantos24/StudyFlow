<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyFlow – planos de estudo e acompanhamento</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--surface:#fff;--ink:#14213d;--muted:#5b6b82;--line:#d5dde8;--accent:#1f6feb;--ok:#18a058;--warn:#d9822b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1724;--surface:#172236;--ink:#e8eef8;--muted:#93a3bb;--line:#2a3a54;--accent:#5b9bff;--ok:#3ecf86;--warn:#f0a35a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Source Serif 4",Georgia,serif}
h1,h2,h3,button,label,.num{font-family:"Bricolage Grotesque",system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:32px 20px 64px}
header{margin-bottom:28px}
h1{font-size:clamp(2.4rem,7vw,4.2rem);line-height:1;margin:0 0 10px;font-weight:800;letter-spacing:-.03em}
header p{max-width:52ch;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{font-size:1.15rem;margin:0 0 14px}
label{display:block;font-size:.85rem;font-weight:600;margin:12px 0 4px}
input,textarea{width:100%;font:inherit;font-size:.95rem;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
button{font-weight:600;font-size:.92rem;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;background:var(--accent);color:#fff;margin-top:16px}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);margin:0;padding:6px 10px;font-size:.8rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:flex;gap:28px;margin-bottom:20px;flex-wrap:wrap}
.stats div{font-size:.85rem;color:var(--muted)}
.num{display:block;font-size:1.9rem;font-weight:800;color:var(--ink);line-height:1.1}
.plan{margin-bottom:18px}
.plan-head{display:flex;justify-content:space-between;gap:12px;align-items:start}
.plan h3{margin:0;font-size:1.3rem}
.meta{font-size:.85rem;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
li input{width:auto;accent-color:var(--ok)}
li.done span.t{text-decoration:line-through;color:var(--muted)}
li .d{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap}
li .d.late{color:var(--warn);font-weight:600}
.log{display:flex;gap:8px;margin-top:12px}
.log input{max-width:130px}
.log button{margin:0}
.empty{color:var(--muted);text-align:center;padding:36px 12px}
</style>
</head>
<body>
<main>
<header>
  <h1>StudyFlow</h1>
  <p>Crie um plano de estudo com datas sugeridas para cada tópico e acompanhe o que já aprendeu.</p>
</header>
<div class="grid">
  <section class="panel" aria-labelledby="novo">
    <h2 id="novo">Novo plano</h2>
    <label for="nome">Matéria ou objetivo</label>
    <input id="nome" placeholder="Ex.: Estatística para a prova">
    <label for="prazo">Data final</label>
    <input id="prazo" type="date">
    <label for="topicos">Tópicos (um por linha)</label>
    <textarea id="topicos" placeholder="Média e mediana&#10;Desvio padrão&#10;Probabilidade"></textarea>
    <button id="criar">Criar plano</button>
  </section>
  <section aria-live="polite">
    <div class="stats">
      <div><span class="num" id="sPlanos">0</span>planos</div>
      <div><span class="num" id="sTopicos">0%</span>tópicos concluídos</div>
      <div><span class="num" id="sMin">0</span>minutos estudados</div>
    </div>
    <div id="lista"></div>
  </section>
</div>
</main>
<script>
const KEY="studyflow:v1";
let planos=[];
try{planos=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(planos))}catch(e){}};
const $=id=>document.getElementById(id);
const iso=d=>d.toISOString().slice(0,10);
const fmt=s=>new Date(s+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("prazo").min=iso(new Date());

$("criar").onclick=()=>{
  const nome=$("nome").value.trim(), prazo=$("prazo").value;
  const nomes=$("topicos").value.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!nome||!prazo||!nomes.length){alert("Preencha o nome, a data final e pelo menos um tópico.");return}
  const hoje=new Date(); hoje.setHours(12,0,0,0);
  const fim=new Date(prazo+"T12:00:00");
  const dias=Math.max(0,Math.round((fim-hoje)/864e5));
  const topicos=nomes.map((t,i)=>{
    const d=new Date(hoje); d.setDate(d.getDate()+Math.round(dias*(i+1)/nomes.length));
    return {t,data:iso(d),feito:false};
  });
  planos.unshift({id:Date.now(),nome,prazo,topicos,min:0});
  save(); $("nome").value=$("topicos").value=""; render();
};

function render(){
  const hoje=iso(new Date());
  let total=0,feitos=0,min=0;
  planos.forEach(p=>{total+=p.topicos.length;feitos+=p.topicos.filter(t=>t.feito).length;min+=p.min});
  $("sPlanos").textContent=planos.length;
  $("sTopicos").textContent=(total?Math.round(feitos/total*100):0)+"%";
  $("sMin").textContent=min;
  if(!planos.length){$("lista").innerHTML='<div class="panel empty">Nenhum plano ainda. Preencha o formulário para criar o primeiro.</div>';return}
  $("lista").innerHTML=planos.map(p=>{
    const f=p.topicos.filter(t=>t.feito).length, pct=Math.round(f/p.topicos.length*100);
    return `<article class="panel plan">
      <div class="plan-head"><div><h3>${esc(p.nome)}</h3>
      <div class="meta">Até ${fmt(p.prazo)} · ${f} de ${p.topicos.length} tópicos · ${p.min} min</div></div>
      <button class="ghost" data-del="${p.id}">Excluir</button></div>
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      <ul>${p.topicos.map((t,i)=>`<li class="${t.feito?"done":""}">
        <input type="checkbox" id="c${p.id}-${i}" data-p="${p.id}" data-i="${i}" ${t.feito?"checked":""}>
        <label for="c${p.id}-${i}" class="t" style="margin:0;font-family:inherit;font-weight:400"><span class="t">${esc(t.t)}</span></label>
        <span class="d ${!t.feito&&t.data<hoje?"late":""}">${!t.feito&&t.data<hoje?"atrasado · ":""}${fmt(t.data)}</span></li>`).join("")}</ul>
      <div class="log"><input type="number" min="1" placeholder="Minutos" aria-label="Minutos estudados" id="m${p.id}">
      <button data-log="${p.id}">Registrar estudo</button></div>
    </article>`}).join("");
}

$("lista").onclick=e=>{
  const b=e.target;
  if(b.dataset.del){planos=planos.filter(p=>p.id!=b.dataset.del);save();render()}
  if(b.dataset.log){
    const v=parseInt($("m"+b.dataset.log).value,10); if(!v||v<1)return;
    planos.find(p=>p.id==b.dataset.log).min+=v; save(); render();
  }
};
$("lista").onchange=e=>{
  const c=e.target; if(c.dataset.p===undefined)return;
  planos.find(p=>p.id==c.dataset.p).topicos[c.dataset.i].feito=c.checked; save(); render();
};
render();
</script>
</body>
</html>
